name: Automated Tests and Quality Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_civilize
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite, bcmath, curl, gd, zip
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Set Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Database Migrations
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: test_civilize
        DB_USERNAME: root
        DB_PASSWORD: root
      run: |
        php artisan migrate --force
        php artisan db:seed --force

    - name: Execute Automated Feature & Security Tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: test_civilize
        DB_USERNAME: root
        DB_PASSWORD: root
        PAYMENT_WEBHOOK_TOKEN: testing_ci_webhook_secret_key
      run: php artisan test

    - name: Post Failure Comment
      if: failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        node -e '
          const https = require("https");
          const fs = require("fs");
          const { execSync } = require("child_process");
          let output = "";
          try {
            output = execSync("php artisan test --stop-on-failure", {
              env: {
                ...process.env,
                DB_CONNECTION: "mysql",
                DB_HOST: "127.0.0.1",
                DB_PORT: "3306",
                DB_DATABASE: "test_civilize",
                DB_USERNAME: "root",
                DB_PASSWORD: "root",
                PAYMENT_WEBHOOK_TOKEN: "testing_ci_webhook_secret_key"
              }
            }).toString();
          } catch (e) {
            output = (e.stdout ? e.stdout.toString() : "") + "\n" + (e.stderr ? e.stderr.toString() : "");
          }
          const cleanOutput = output.split("\n").slice(-35).join("\n");
          const body = JSON.stringify({ body: "```\n" + cleanOutput + "\n```" });
          const req = https.request({
            hostname: "api.github.com",
            path: `/repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.GITHUB_SHA}/comments`,
            method: "POST",
            headers: {
              "User-Agent": "Node",
              "Authorization": `Bearer ${process.env.GH_TOKEN}`,
              "Content-Type": "application/json",
              "Content-Length": Buffer.byteLength(body)
            }
          }, (res) => {
            console.log("Status: " + res.statusCode);
          });
          req.write(body);
          req.end();
        '
